/* Meowfield identity, product spread and dated inbox */
:root {
  --meow-script: "Kunstler Script", "Snell Roundhand", "Segoe Script", "Apple Chancery", cursive;
  --plum: #4d405d;
  --lilac-paper: #f5f0f7;
  --lilac-line: #d9cce0;
}
body {background:var(--lilac-paper);color:#30263a;}
.logo,.signature,.interim h1 {font-family:var(--meow-script);font-style:normal;font-weight:400;letter-spacing:0;}
.logo {font-size:clamp(32px,4vw,48px);color:#4d405d;white-space:nowrap;}
.logo sup {color:#846991;margin-left:.2em;vertical-align:super;}
.signature {font-size:clamp(58px,11vw,124px);line-height:.8;text-align:center;width:94%;animation-duration:4.2s;}
.signature p {font:italic clamp(14px,3vw,19px)/1.5 Georgia,serif;margin-top:20px;}
.flight {animation-duration:4.2s;color:#c3a9ce;}
.intro {animation-duration:4.3s;}
.cover.interim {display:block;text-align:center;background:#382d43;color:#f4e7f7;}
.interim .copy {padding:clamp(35px,6vw,82px) 16px;}
.interim h1 {font-size:clamp(68px,15vw,162px);line-height:.8;margin:0 0 17px;}
.site-footer {text-align:center;border-top:1px solid var(--lilac-line);margin:42px auto 0;width:min(1200px,92%);padding:26px 12px 33px;color:#685471;font:italic 17px/1.5 Georgia,serif;}
.primary,.filters [aria-pressed=true],nav b {background:var(--plum);}
.filters button,.add,select {border-color:var(--lilac-line);}
.spread {max-width:1080px;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:clamp(24px,6vw,88px);align-items:start;}
.gallery {min-width:0;display:grid;justify-items:center;gap:10px;}
.heroImg {width:auto;max-width:100%;height:auto;display:block;background:none;}
#thumbs {justify-content:center;}
.product-info {padding:clamp(14px,2vw,30px) 0;}
.product-info .browse {margin:10px 0 0 5px;}
.product-description {border-top:1px solid var(--lilac-line);margin-top:27px;padding-top:17px;}
.product-description p {margin:6px 0 0;line-height:1.8;}
.archive {border-top:1px solid var(--lilac-line);margin:15px 0;}
.archive summary {cursor:pointer;padding:13px 0;font-weight:600;color:var(--plum);}
.order,dialog,select {background:#fbf7fc;border-color:var(--lilac-line);}
.item-note {grid-column:2/-1;margin:0;background:#eee6f2;padding:9px 12px;border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere;}
.note-form label,.note-form textarea {display:block;width:100%;}
.note-form textarea {font:inherit;color:inherit;margin:8px 0 15px;padding:10px;border:1px solid var(--lilac-line);background:white;resize:vertical;}
.note-form div {display:flex;justify-content:flex-end;gap:8px;}
@media(max-width:650px) {
  .spread {grid-template-columns:1fr;}
  .product-info {padding-top:0;}
  .logo {font-size:33px;}
}

/* Moonlit cover and compact, touch-friendly cards */
.wordmark {display:block;width:100%;height:auto;}
.logo {width:clamp(118px,17vw,166px);flex-shrink:0;}
.signature .wordmark {width:min(72vw,360px);margin:auto;}
.flight {width:110px;}
.cover.moon-cover {display:flex;align-items:center;min-height:clamp(270px,35vw,470px);text-align:left;background:#292333;border-radius:28px;isolation:isolate;}

.moon-cover .browse {margin-top:14px;color:#f7edf8;}
@keyframes moon-drift {from{transform:scale(1)}to{transform:scale(1.045) translateX(-.4%)}}
#grid {grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start;}
#grid article {background:#fcf9fd;border:1px solid #e3d9e8;border-radius:20px;overflow:hidden;padding:8px;}
#grid .image {border-radius:13px;aspect-ratio:4/4.5;}
#grid article small,#grid article h3,#grid .cost {margin-right:3px;margin-left:3px;}
#grid article h3 {font-size:14px;line-height:1.4;overflow-wrap:anywhere;}
#grid .cost strong,#grid .cost span {display:block;line-height:1.4;}
#grid .cost {font-size:12px;margin-bottom:3px;}
#grid .add {width:42px;height:42px;}
.gallery .heroImg {border-radius:17px;}
#thumbs img,.line img {border-radius:12px;}
.order,.archive,.cart-line,.cart-total,.cart-empty,dialog {border-radius:20px;}
.archive {border:1px solid var(--lilac-line);padding:0 14px;}
.cart-shell {max-width:750px;}
.cart-line {grid-template-columns:82px minmax(0,1fr);gap:9px 13px;padding:13px;margin:12px 0;background:#fcf9fd;border:1px solid var(--lilac-line);}
.cart-line img {display:block;width:82px;height:104px;}
.cart-line h3 {line-height:1.4;margin-bottom:4px;}
.cart-actions {display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;grid-column:2;}
.cart-actions button,.cart-actions span {padding:5px 10px;border-radius:999px;background:#eee7f2;text-decoration:none;font-size:13px;}
.cart-actions button {min-height:40px;}
.cart-actions button:last-child {background:transparent;color:#6d5876;}
.cart-total,.cart-empty {padding:16px;background:#eee7f2;border:1px solid var(--lilac-line);}
.cart-shell footer.cart-total {margin-top:18px;padding:15px 16px;}
.cart-total strong,.cart-total span {display:block;}
.cart-total button {border-radius:13px;min-height:44px;white-space:nowrap;}
@media(max-width:950px) {#grid {grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(max-width:680px) {
  header,main {width:calc(100% - 28px);}
  header nav {gap:7px;}
  header nav a {display:inline-flex;align-items:center;min-height:44px;white-space:nowrap;}
  .cover.moon-cover {border-radius:22px;min-height:255px;}
  .moon-cover::before {background-position:64% 55%;}
  .moon-cover .copy {width:64%;padding:18px;}
  #grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  #grid article {padding:6px;border-radius:16px;}
  #grid .cost {gap:2px;}
  #grid .add {width:44px;height:44px;}
  .cart-line {grid-template-columns:65px minmax(0,1fr);}
  .cart-line img {width:65px;height:85px;}
  .cart-line .item-note {grid-column:1/-1;}
  .cart-actions button {min-height:44px;}
  .cart-shell footer.cart-total {flex-wrap:wrap;}
  dialog {max-width:calc(100% - 28px);}
  .note-form textarea {font-size:16px;}
}
@media(prefers-reduced-motion:reduce) {.moon-cover::before{animation:none;}}

}

  const tailX = 1054;
  const tailY = 673;
  tailLayer.width = 69;
  tailLayer.height = 53;

  function tailOutline(context) {

    context.bezierCurveTo(1071, 706, 1094, 704, 1100, 690);
    context.bezierCurveTo(1105, 683, 1093, 680, 1087, 681);

    context.bezierCurveTo(1122, 711, 1093, 722, 1054, 721);

  }

  function prepare() {
    base.drawImage(picture, 0, 0, width, height);
    const sprite = tailLayer.getContext('2d');
    sprite.translate(-tailX, -tailY);
    tailOutline(sprite);
    sprite.clip();

    const patch = document.createElement('canvas');

  "sh-10004038": "带 SH 标志的系带设计十分抢眼，荷叶边口袋也很可爱。",
  "sh-10004149": "闪亮的十字吊坠和带装饰链的蝴蝶结是这款的亮点。",
  "sh-10004114": "仿围裙的设计搭配醒目的蝴蝶结，很适合喜欢甜美风的人。",
  "sh-10004230": "胸前叠加精致的蕾丝，华丽的胸口设计是亮点。",
  "sh-10004144": "蓬松的肩胸荷叶边和两层阶梯式下摆是可爱之处。",
  "sh-10004157": "水手领叠加蕾丝，背影也显得可爱。",
  "sh-10004062": "醒目的大蝴蝶结和爱心贴布，呈现 Secret Honey 一贯的甜美感。"
};
function description(p){
 const translated=translatedDescriptions[p.id]||p.descriptionZh;
 return '<div class="product-description"><h3>商品简介</h3><p>'+escapeText(translated||'暂无官方简介，但mcw一定会觉得你穿这件还不错。')+'</p></div>';
}
async function product(){
 const p=products.get(new URLSearchParams(location.search).get('id'));if(!p){main.textContent='未找到商品';return;}
 main.innerHTML='<div class="spread"><div class="gallery"><img id="hero" class="heroImg" src="'+escapeText(p.photo)+'" alt="'+escapeText(p.name)+'"><div id="thumbs"></div><p id="galleryState">正在读取原店图片…</p></div><section class="product-info"><small>'+escapeText(p.brand)+'</small><h2>'+escapeText(p.name)+'</h2><p>'+escapeText(p.type)+'</p><div class="amount">'+money(p.price)+'</div><p>汇率日期 '+data.date+'</p>'+addButton(p,' 加入购物车')+' <a class="browse" target="_blank" rel="noopener" href="'+escapeText(p.url)+'">访问原站 ↗</a>'+description(p)+'</section></div>';
 try{const urls=p.images || savedGalleries[p.id] || [p.photo];$('galleryState').textContent=urls.length>1?'共 '+urls.length+' 张图片':'原店仅返回封面图';
 urls.forEach((url,i)=>{const b=document.createElement('button'),img=new Image();img.src=url;img.alt='查看第 '+(i+1)+' 张';img.loading='lazy';b.append(img);b.onclick=()=>$('hero').src=url;$('thumbs').append(b);});}catch{$('galleryState').textContent='原店图片暂未载入，可刷新重试。';}
}
function line(p,n,rate,edit){
 return '<div class="line'+(edit?' cart-line':'')+'"><a href="'+detail(p.id)+'"><img src="'+escapeText(p.photo)+'" alt="'+escapeText(p.name)+'"></a><div><small>'+escapeText(p.brand)+'</small><h3>'+escapeText(p.name)+'</h3>'+money(p.price*n,rate)+'</div><div'+(edit?' class="cart-actions"':'')+'><span>× '+n+'</span>'+(edit?'<button data-note="'+p.id+'">'+(notes[p.id]?'编辑备注':'写备注')+'</button><button data-remove="'+p.id+'">移除</button>':'')+'</div>'+((edit?notes[p.id]:p.note)?'<p class="item-note">'+escapeText(edit?notes[p.id]:p.note)+'</p>':'')+'</div>';
}
function cart(){
 const list=entries();
 main.innerHTML='<section class="sheet cart-shell"><small>YOUR SELECTION</small><h2>购物车</h2>'+list.map(([id,n])=>line(products.get(id),n,data.rate,true)).join('')+(list.length?'<footer class="cart-total"><div>合计 '+money(list.reduce((s,[id,n])=>s+products.get(id).price*n,0))+'</div><span>手机预览 · 选款保存在此浏览器</span></footer>':'<div class="cart-empty"><p>购物车还是空的。</p><a href="?#collection">继续选款 →</a></div>')+'</section>';
}

function saveNotes(){localStorage.setItem('meowfield-notes',JSON.stringify(notes));}
function editNote(id){
 const dialog=document.createElement('dialog');
 dialog.innerHTML='<form class="note-form"><label>商品备注<textarea maxlength="500" rows="5" placeholder="写下你对这件的想法"></textarea></label><div><button type="button">取消</button><button class="primary">保存备注</button></div></form>';
 const input=dialog.querySelector('textarea');input.value=notes[id]||'';
 dialog.querySelector('[type=button]').onclick=()=>dialog.close();
 dialog.querySelector('form').onsubmit=e=>{
  e.preventDefault();const note=input.value.trim();
  if(note)notes[id]=note;else delete notes[id];
  saveNotes();localStorage.removeItem('mine-request');dialog.close();cart();
  main.querySelector('[data-note="'+id+'"]')?.focus();
 };
 dialog.addEventListener('close',()=>dialog.remove(),{once:true});
 document.body.append(dialog);dialog.showModal();input.focus();
}
main.addEventListener('click',e=>{const a=e.target.closest('[data-add]'),r=e.target.closest('[data-remove]');if(a){const id=a.dataset.add;bag[id]=Math.min((bag[id]||0)+1,999);sync();localStorage.removeItem('mine-request');notice('已加入购物车');}const noteButton=e.target.closest('[data-note]');if(noteButton)editNote(noteButton.dataset.note);if(r){delete notes[r.dataset.remove];saveNotes();delete bag[r.dataset.remove];sync();localStorage.removeItem('mine-request');cart();}});
(async()=>{data=JSON.parse(document.querySelector('#catalog').textContent);products=new Map(data.items.map(p=>[p.id,p]));
 const groups=[...new Set(data.items.map(p=>p.brand))].map(b=>data.items.filter(p=>p.brand===b));
 displayOrder=[];for(let i=0;i<Math.max(...groups.map(g=>g.length));i++)for(const group of groups)if(group[i])displayOrder.push(group[i]);
 sync();const page=new URLSearchParams(location.search).get('page');if(page==='cart')cart();else if(page==='product')await product();else home();})().catch(()=>main.textContent='页面读取失败，请刷新重试。');
</script></body></html>
